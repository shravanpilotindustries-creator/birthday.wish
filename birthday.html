<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb);
        font-family:Arial,sans-serif;
        text-align:center;
        color:white;
    }
    .card{
        background:rgba(255,255,255,0.15);
        padding:40px;
        border-radius:20px;
        backdrop-filter:blur(10px);
    }
    h1{
        font-size:3em;
        margin-bottom:10px;
    }
    p{
        font-size:1.3em;
    }
</style>
</head>
<body>
    <div class="card">
        <h1>🎂 Happy Birthday! 🎉</h1>
        <p>Wishing you happiness, success, and lots of wonderful moments.</p>
        <p><strong>Have an amazing year ahead!</strong></p>
        <p>🎁 From: Shravan</p>
    </div>
</body>
</html>
